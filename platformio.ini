; pedal-core is a library, not a firmware: this project file exists only to run
; the host-native unit tests. Consumers build the library through PlatformIO's
; LDF from their own lib/ directory and never use this file.
[platformio]
default_envs = native

; ---------------------------------------------------------------------------
; Host-native unit tests.  Run with:  pio test -e native
;
; test/support/ carries the fakes (systick, watchdog, a stub product config)
; and is built as a static library by native_test_setup.py, so a test that
; #includes a real driver .cpp behind its own in-TU stubs pulls only the
; library members it leaves undefined.
;
; The src filter builds only font_data.cpp: eeprom.cpp and display.cpp are
; compiled INTO their test TUs (behind recording stubs), so building them here
; as well would define every symbol twice.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<font_data.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Iinclude
    -Itest/support
extra_scripts = pre:test/native_test_setup.py
