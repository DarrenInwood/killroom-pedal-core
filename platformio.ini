; pedal-core is a library, not a firmware: this project file exists only to run
; the host-native unit tests. Consumers build the library through PlatformIO's
; LDF from their own lib/ directory and never use this file.
[platformio]
default_envs = native

; ---------------------------------------------------------------------------
; Host-native unit tests.  Run with:  pio test -e native
;
; test/support/ carries the fakes (systick, watchdog, a stub product config)
; and is built as a static library by native_test_setup.py, so a test that
; #includes a real driver .cpp behind its own in-TU stubs pulls only the
; library members it leaves undefined.
;
; The src filter builds only font_data.cpp: eeprom.cpp and display.cpp are
; compiled INTO their test TUs (behind recording stubs), so building them here
; as well would define every symbol twice.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<font_data.cpp> +<footswitch.cpp> +<block_store.cpp>
    +<tap_tempo.cpp> +<tempo_controller.cpp> +<tempo_led.cpp> +<external_input.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Iinclude
    -Itest/support
; Both optional domains are on here, so this env only ever builds the present side of the
; feature switches. The absent side is native_minimal's, below.
test_ignore = test_features_absent
extra_scripts = pre:test/native_test_setup.py

; ---------------------------------------------------------------------------
; The other side of the feature switches.  Run with:  pio test -e native_minimal
;
; The library as a product that wants neither optional domain builds it: both
; PEDAL_CORE_HAS_* are 0, so tap_tempo.cpp, tempo_controller.cpp, tempo_led.cpp,
; midi_clock_out.cpp and external_input.cpp each compile to an empty translation
; unit and everything else still has to stand up beside them.
;
; This env exists because that branch was never built by anything. test/support
; puts every config header on the include path, so under the old __has_include
; guards the present side was the only side the suite could reach -- and a module
; silently producing no symbols is exactly the failure those guards created.
;
; The switches come from -D rather than a second stub file: a quoted include
; resolves against the including file's own directory first, so two files named
; pedal_core_features.hpp on the path would be resolved differently depending on
; where a translation unit sat. test/support's stub defers to the build for
; exactly this reason.
; ---------------------------------------------------------------------------
[env:native_minimal]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = ${env:native.build_src_filter}
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Iinclude
    -Itest/support
    -DPEDAL_CORE_HAS_TEMPO=0
    -DPEDAL_CORE_HAS_EXTINPUT=0
test_filter = test_features_absent
extra_scripts = pre:test/native_test_setup.py
