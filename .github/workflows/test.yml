name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Most host-side tools are proved by the consumers' golden diffs, which cannot run
  # here (some need pcbnew, none of them ship a board). Compiling them is the guard
  # against a library whose Python is broken for every consumer at once. The three
  # that can be tested here are tested here.
  tools-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The shared tools parse
        run: python -m compileall -q tools/
      - name: The shell engines parse
        run: for s in tools/*.sh; do bash -n "$s"; done

      # netlist.py is the one thing under tools/kicad/ that can be tested here:
      # everything else needs pcbnew and a board. It is also the piece three tools
      # share, so a change to it is a change to all of them.
      - name: The netlist parser reads a fixture correctly
        run: python tools/kicad/test_netlist.py

      # The release gate re-implements app_image::validate(), so the descriptor's layout
      # is asserted in both C++ and Python. Both walk one set of fixtures, and a
      # divergence between them fails here rather than leaving a pedal in DFU.
      - name: The release gate agrees with the bootloader
        run: python tools/test_app_image.py

      # A screenshot's compressed bytes depend on the zlib build that wrote them, so a
      # regenerated-but-unchanged screen is a different file holding the same picture.
      # Consumers regenerate on a checklist, so without this every run churns every PNG
      # and buries the one that actually moved.
      - name: Screens are rewritten only when their pixels change
        run: python tools/test_oled_png.py

      # This library's own docs, by the same gate the consumers run over theirs.
      - name: Every relative doc link resolves
        run: python tools/check_doc_links.py

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run native tests
        run: pio test -e native
